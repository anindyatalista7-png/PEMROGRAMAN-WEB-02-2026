<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Tugas Tim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">
  <div class="mx-auto max-w-6xl px-4 py-6 sm:px-5">

    <!-- HEADER -->
    <header class="mb-5">
      <h1 class="text-2xl font-bold">Papan Tugas Tim</h1>
      <p class="mt-1 text-sm text-slate-500">
        Kelola tugas anggota tim Marsha
      </p>
    </header>

    <!-- CONTENT -->
    <div class="grid grid-cols-1 gap-5 lg:grid-cols-[230px_minmax(0,1fr)]">

      <!-- DAFTAR ANGGOTA -->
      <aside class="rounded-xl bg-white p-4 shadow-sm">
        <h2 class="mb-1 text-lg font-bold">Tim Marsha</h2>
        <p class="mb-3 text-xs text-slate-500">Anggota</p>

        <p id="member-status"
           class="mb-3 text-xs text-slate-500"
           aria-live="polite">Memuat anggota...</p>

        <div id="member-list" class="space-y-1"></div>
      </aside>

      <!-- BAGIAN TUGAS -->
      <main class="min-w-0 rounded-xl bg-white shadow-sm">

        <!-- JUDUL DAN PROGRESS -->
        <section class="border-b border-slate-200 p-4 sm:p-5">
          <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
            <div>
              <h2 id="task-heading" class="text-xl font-bold">
                Pilih anggota
              </h2>
              <p id="progress" class="mt-1 text-sm text-slate-500">
                Belum ada anggota dipilih.
              </p>
            </div>

            <div class="w-full sm:w-40">
              <div class="h-1.5 overflow-hidden rounded-full bg-slate-200">
                <div id="progress-bar"
                     class="h-full w-0 rounded-full bg-emerald-500 transition-all duration-300"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- PENCARIAN DAN TAMBAH TUGAS -->
        <section class="border-b border-slate-200 px-4 pt-3 pb-2 sm:px-5">
          <div class="grid grid-cols-1 gap-2 md:grid-cols-[1fr_1.5fr]">

            <input id="search-input"
                   type="text"
                   placeholder="Cari judul tugas"
                   aria-label="Cari judul tugas"
                   class="w-full min-w-0 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-blue-400 focus:bg-white">

            <form id="task-form" class="flex min-w-0 gap-2">
              <input id="task-title"
                     type="text"
                     placeholder="Tambah tugas baru, minimal 5 karakter"
                     aria-label="Judul tugas baru"
                     class="min-w-0 flex-1 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm outline-none focus:border-blue-400 focus:bg-white">

              <button id="save-button"
                      type="submit"
                      class="shrink-0 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60">
                Simpan
              </button>
            </form>
          </div>

          <p id="form-message"
             class="mt-1 hidden text-xs"
             aria-live="polite"></p>

          <p id="notification"
             class="mt-1 hidden text-xs font-medium text-emerald-600"
             aria-live="polite"></p>
        </section>

        <!-- STATUS LOADING / ERROR -->
        <p id="task-status"
           class="hidden px-4 text-sm text-slate-500 sm:px-5"
           aria-live="polite"></p>

        <!-- DAFTAR TUGAS -->
        <div id="task-list"
             class="divide-y divide-slate-100 px-4 sm:px-5"></div>

        <!-- HASIL PENCARIAN KOSONG -->
        <p id="no-match"
           class="hidden px-5 py-6 text-center text-sm text-slate-500">
          Tidak ada tugas yang cocok.
        </p>

      </main>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
